<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Konten Terlindungi</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(900px 500px at 70% -10%,rgba(99,102,241,.2),transparent 60%),
      radial-gradient(700px 400px at 20% 110%,rgba(34,211,238,.14),transparent 60%),#0a0f1e;
    color:#e2e8f0;line-height:1.55}
  .card{width:100%;max-width:380px;background:#101830;border:1px solid rgba(148,163,184,.16);
    border-radius:16px;padding:28px;text-align:center;box-shadow:0 24px 60px rgba(2,6,23,.55)}
  .lock{width:52px;height:52px;margin:0 auto 14px;border-radius:14px;display:flex;align-items:center;
    justify-content:center;background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(129,140,248,.18));
    border:1px solid rgba(34,211,238,.35)}
  h1{font-size:18px;margin-bottom:6px}
  p{font-size:13.5px;color:#8ea0bf;margin-bottom:18px}
  input{width:100%;background:#0b1224;border:1px solid rgba(148,163,184,.2);border-radius:10px;
    padding:11px 13px;color:#fff;font:inherit;font-size:14px;margin-bottom:12px}
  input:focus{outline:none;border-color:rgba(34,211,238,.55);box-shadow:0 0 0 3px rgba(34,211,238,.14)}
  button{width:100%;padding:11px 14px;border:0;border-radius:10px;font:inherit;font-size:14px;font-weight:700;
    color:#04121a;cursor:pointer;background:linear-gradient(135deg,#22d3ee,#818cf8)}
  button:disabled{opacity:.6;cursor:wait}
  .msg{margin-top:12px;font-size:13px;min-height:18px;color:#f87171;font-weight:600}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="lock">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  </div>
  <h1>Konten Terlindungi</h1>
  <p>Masukkan password untuk membuka isinya.</p>
  <input type="password" id="pw" placeholder="Password" autocomplete="off" autocapitalize="off">
  <button id="go" type="button">Buka Kunci</button>
  <div class="msg" id="msg"></div>
</div>

  var ITER = 300000;
  var msg = document.getElementById('msg');
  var btn = document.getElementById('go');
  var card = document.getElementById('card');
  function b64ToBytes(b64){
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function fail(text){
    msg.textContent = text;
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
    btn.disabled = false;
  }
  function unlock(){
    var pw = document.getElementById('pw').value;
    if (!pw) { fail('Masukkan password terlebih dahulu.'); return; }

    var parts = PAYLOAD.split(':');

    var salt = b64ToBytes(parts[1]);
    var iv = b64ToBytes(parts[2]);
    var ct = b64ToBytes(parts[3]);
    var enc = new TextEncoder();
    if (!(window.crypto && window.crypto.subtle)) { fail('Browser tidak mendukung untuk membuka konten ini.'); return; }
    crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey'])

        return crypto.subtle.deriveKey(

          base, { name:'AES-GCM', length:256 }, false, ['decrypt']);

        document.open();
        document.write(html);
        document.close();
      })
      .catch(function(){ fail('Password salah.'); });

  document.getElementById('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') unlock(); });
  document.getElementById('pw').focus();
